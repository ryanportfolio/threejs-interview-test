<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Interactive Exhibit</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #10131c;
        transition: opacity 0.4s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader svg {
        width: min(520px, 82vw);
      }
      @media (prefers-reduced-motion: reduce) {
        #ldr-stage {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <svg viewBox="0 0 480 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">
        <g id="ldr-stage">
          <!-- glow ring under the turret -->
          <ellipse cx="240" cy="182" rx="78" ry="9" fill="#8be8ff" opacity="0.1">
            <animate attributeName="opacity" values="0.07;0.16;0.07" dur="2.4s" repeatCount="indefinite" />
          </ellipse>

          <!-- turret: static pedestal + base, rotating head at pivot (240,150) -->
          <g transform="translate(240,150)">
            <ellipse cx="0" cy="30" rx="24" ry="4" fill="#2f3440" />
            <rect x="-17" y="21" width="34" height="8" rx="3" fill="#3b4252" />
            <rect x="-13" y="4" width="26" height="18" rx="3" fill="#5e81ac" />
            <g id="ldr-head">
              <!-- beam and muzzle flash ride inside the head so they always align with the aim -->
              <rect x="42" y="-1.5" width="200" height="3" rx="1.5" fill="#8be8ff" opacity="0">
                <animate
                  attributeName="opacity"
                  values="0;0;0.95;0.5;0;0"
                  keyTimes="0;0.53;0.56;0.59;0.63;1"
                  dur="2.4s"
                  repeatCount="indefinite"
                />
              </rect>
              <circle cx="41" cy="0" r="6" fill="#d6f6ff" opacity="0">
                <animate
                  attributeName="opacity"
                  values="0;0;1;0;0"
                  keyTimes="0;0.53;0.555;0.61;1"
                  dur="2.4s"
                  repeatCount="indefinite"
                />
              </circle>
              <rect x="8" y="-2.5" width="32" height="5" rx="1.5" fill="#d8dee9" />
              <rect x="-9" y="-7" width="18" height="14" rx="2" fill="#81a1c1" />
              <circle cx="-6" cy="-9" r="2.2" fill="#2fd27d">
                <animate
                  attributeName="fill"
                  values="#ff4d4d;#ff9d4d;#2fd27d;#ff4d4d"
                  keyTimes="0;0.35;0.55;1"
                  dur="2.4s"
                  repeatCount="indefinite"
                />
              </circle>
              <!-- tracks the drone with lag, aligns at the moment of the shot (55%) -->
              <animateTransform
                attributeName="transform"
                type="rotate"
                values="-160 0 0;-125 0 0;-75 0 0;-62 0 0;-95 0 0;-160 0 0"
                keyTimes="0;0.3;0.55;0.68;0.82;1"
                calcMode="spline"
                keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
                dur="2.4s"
                repeatCount="indefinite"
              />
            </g>
          </g>

          <!-- drone: crosses left to right, gets hit at 55%, tumbles and falls -->
          <g id="ldr-drone">
            <ellipse cx="-13" cy="-4" rx="5.5" ry="1.6" fill="#2f3440" opacity="0.9" />
            <ellipse cx="13" cy="-4" rx="5.5" ry="1.6" fill="#2f3440" opacity="0.9" />
            <rect x="-14" y="-1.5" width="9" height="2.4" fill="#2f3440" />
            <rect x="5" y="-1.5" width="9" height="2.4" fill="#2f3440" />
            <rect x="-8" y="-3" width="16" height="6" rx="2.5" fill="#bf616a" />
            <circle cx="3" cy="-1.5" r="2.4" fill="#2f3440" />
            <animateTransform
              attributeName="transform"
              type="translate"
              values="-40 50;268 50;330 152;-40 50;-40 50"
              keyTimes="0;0.55;0.75;0.751;1"
              dur="2.4s"
              repeatCount="indefinite"
              additive="replace"
            />
            <animateTransform
              attributeName="transform"
              type="rotate"
              values="0;0;150;0;0"
              keyTimes="0;0.55;0.75;0.751;1"
              dur="2.4s"
              repeatCount="indefinite"
              additive="sum"
            />
            <animate
              attributeName="opacity"
              values="1;1;0.9;0;0;1"
              keyTimes="0;0.55;0.62;0.74;0.97;1"
              dur="2.4s"
              repeatCount="indefinite"
            />
          </g>

          <!-- impact sparks at the hit point -->
          <g transform="translate(268,50)">
            <circle r="2.4" fill="#8be8ff" opacity="0">
              <animateTransform attributeName="transform" type="translate" values="0 0;0 0;22 -15;22 -15" keyTimes="0;0.55;0.72;1" dur="2.4s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.549;0.57;0.72;1" dur="2.4s" repeatCount="indefinite" />
            </circle>
            <circle r="2" fill="#ffd479" opacity="0">
              <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-18 -10;-18 -10" keyTimes="0;0.55;0.72;1" dur="2.4s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.549;0.57;0.72;1" dur="2.4s" repeatCount="indefinite" />
            </circle>
            <circle r="1.8" fill="#d6f6ff" opacity="0">
              <animateTransform attributeName="transform" type="translate" values="0 0;0 0;14 18;14 18" keyTimes="0;0.55;0.72;1" dur="2.4s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.549;0.57;0.72;1" dur="2.4s" repeatCount="indefinite" />
            </circle>
            <circle r="1.6" fill="#8be8ff" opacity="0">
              <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-10 16;-10 16" keyTimes="0;0.55;0.72;1" dur="2.4s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.549;0.57;0.72;1" dur="2.4s" repeatCount="indefinite" />
            </circle>
          </g>
        </g>

        <!-- wordmark + pulse dots -->
        <text
          x="240"
          y="216"
          text-anchor="middle"
          fill="#9fb0c3"
          font-family="system-ui, sans-serif"
          font-size="11"
          letter-spacing="4"
        >
          RYAN ALLEN - SKILLS TEST
        </text>
        <g fill="#8be8ff">
          <circle cx="228" cy="228" r="2.2">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite" />
          </circle>
          <circle cx="240" cy="228" r="2.2">
            <animate attributeName="opacity" values="0.2;1;0.2" begin="0.2s" dur="1.2s" repeatCount="indefinite" />
          </circle>
          <circle cx="252" cy="228" r="2.2">
            <animate attributeName="opacity" values="0.2;1;0.2" begin="0.4s" dur="1.2s" repeatCount="indefinite" />
          </circle>
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
